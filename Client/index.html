<!doctype html>
<html lang="en" class="dark scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- SEO Meta Tags -->
    <title>OFFSCRIPT — #beoffscript | College Event Discovery Hub</title>
    <meta
      name="description"
      content="OFFSCRIPT is the campus fest and event discovery hub where students discover and register for hackathons, design jams, cultural stages, and creative campus fests. #beoffscript"
    />
    <meta name="theme-color" content="#111210" />

    <!-- Open Graph / Social -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="OFFSCRIPT — #beoffscript | College Event Discovery Hub" />
    <meta
      property="og:description"
      content="The college fest and event discovery hub. Curated campus hackathons, design jams, and fest stages."
    />
    <meta property="og:site_name" content="OFFSCRIPT" />
    <meta name="twitter:card" content="summary_large_image" />

    <meta
      name="twitter:description"
      content="The college fest and event discovery hub. Curated campus hackathons, design jams, and fest stages."
    />

    <!-- Preconnects & DNS-Prefetch for Critical Origins -->
    <link rel="preconnect" href="https://render72.pages.dev" crossorigin />
    <link rel="dns-prefetch" href="https://render72.pages.dev" />
    <link rel="preconnect" href="https://images.pexels.com" crossorigin />
    <link rel="dns-prefetch" href="https://images.pexels.com" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Synchronous Lite Mode Determination before First Paint to prevent flash/overhead -->
    <script>
      (function() {
        try {
          var isTouch = 'ontouchstart' in window || (navigator.maxTouchPoints != null && navigator.maxTouchPoints > 0);
          var isMobileUA = /Mobi|Android|iPhone|iPad|webOS|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
          var lowCores = navigator.hardwareConcurrency != null && navigator.hardwareConcurrency <= 4;
          var lowMem = navigator.deviceMemory != null && navigator.deviceMemory <= 4;
          var saveData = navigator.connection && navigator.connection.saveData;
          var reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
          if (isTouch || isMobileUA || lowCores || lowMem || saveData || reduced) {
            document.documentElement.setAttribute('data-perf', 'lite');
          } else {
            document.documentElement.setAttribute('data-perf', 'full');
          }
        } catch (e) {
          document.documentElement.setAttribute('data-perf', 'lite');
        }
      })();
    </script>

    <!-- Metric-Matched Fallback Font to Eliminate CLS -->
    <style>
      @font-face {
        font-family: 'Bricolage Grotesque Fallback';
        src: local('Arial');
        ascent-override: 95%;
        descent-override: 25%;
        line-gap-override: 0%;
        size-adjust: 100%;
      }
      @font-face {
        font-family: 'JetBrains Mono Fallback';
        src: local('Courier New'), local('monospace');
        ascent-override: 95%;
        descent-override: 25%;
        line-gap-override: 0%;
        size-adjust: 100%;
      }
    </style>

    <!-- Non-Render-Blocking Google Fonts with display: swap -->
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600..800&family=JetBrains+Mono:wght@400;700&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600..800&family=JetBrains+Mono:wght@400;700&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600..800&family=JetBrains+Mono:wght@400;700&display=swap"
      />
    </noscript>
  </head>
  <body class="bg-ink text-bone font-sans antialiased selection:bg-volt selection:text-ink min-h-screen">

  </body>
